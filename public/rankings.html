<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rankings | Yeeps Arena</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <header class="site-header">
        <a class="site-name" href="/">
            Yeeps Arena
        </a>
        <nav aria-label="Main navigation">
            <a href="/">Home</a>
            <a href="/rankings.html" aria-current="page">Rankings</a>
            <a href="/regulations.html">Regulations</a>
        </nav>
    </header>
    <main>
        <section class="leaderboard-header">
            <p class="eyebrow">Competitive rankings</p>
            <h1 id="season-name">Leaderboard</h1>
            <p>
                Approved regulation matches determine player ratings.
            </p>
        </section>
        <section class="leaderboard-panel">
            <div id="leaderboard-loading" role="status">
                Loading rankings...
            </div>
            <div id="leaderboard-error" class="error-message" role="alert" hidden></div>
            <div class="table-wrapper">
                <table id="leaderboard-table" hidden>
                    <thead>
                        <tr>
                            <th scope="col">Rank</th>
                            <th scope="col">Player</th>
                            <th scope="col">Rating</th>
                            <th scope="col">Wins</th>
                            <th scope="col">Losses</th>
                            <th scope="col">Matches</th>
                            <th scope="col">Win rate</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body"></tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="/rankings.js"></script>
</body>
</html>
